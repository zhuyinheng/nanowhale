<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nanowhale — Architecture</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #14171d;
    --bg-2: #1c2029;
    --bg-3: #262b37;
    --line: #303644;
    --line-2: #404858;
    --fg: #e9ecf1;
    --fg-muted: #8a93a6;
    --fg-faint: #5a6273;

    --c-token:  #ffd166;
    --c-embed:  #f4a261;
    --c-tensor: #cad2c5;
    --c-hc:     #f72585;
    --c-norm:   #6ee7b7;
    --c-attn:   #5eb1ff;
    --c-moe:    #b18cff;
    --c-rope:   #ff6e7f;
    --c-sdpa:   #4cc9f0;
    --c-lmhead: #f4a261;
    --c-logits: #ffd166;
    --c-router: #c084fc;
    --c-expert: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 13.5px; line-height: 1.5;
    overflow: hidden; height: 100vh;
  }
  code, .mono, .formula {
    font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
    font-size: 12px;
  }
  a { color: var(--c-attn); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header {
    height: 56px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #1a1f29 0%, #14171d 100%);
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px;
  }
  header .title { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; }
  header .title .whale { font-size: 18px; vertical-align: -2px; }
  header .sub { color: var(--fg-muted); font-size: 12px; }
  header .chips { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; }
  header .chip {
    background: var(--bg-2); border: 1px solid var(--line);
    padding: 4px 10px; border-radius: 999px; font-size: 11.5px;
  }
  header .chip b { color: var(--c-attn); font-weight: 600; margin-left: 4px; }

  main {
    display: grid;
    grid-template-columns: 1fr 380px;
    height: calc(100vh - 56px);
  }

  #canvas-wrap {
    position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #1d222d 0%, var(--bg) 70%);
    cursor: grab;
  }
  #canvas-wrap.grabbing { cursor: grabbing; }
  #scene { display: block; user-select: none; }

  .controls {
    position: absolute; right: 14px; top: 14px;
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 4px;
    display: flex; gap: 2px; z-index: 10;
  }
  .controls button {
    background: transparent; color: var(--fg-muted); border: 0;
    padding: 6px 10px; font-size: 13px; cursor: pointer; border-radius: 5px;
  }
  .controls button:hover { background: var(--bg-3); color: var(--fg); }
  .controls .sep { width: 1px; background: var(--line); margin: 4px 2px; }
  .controls .scale-label {
    color: var(--fg-muted); padding: 6px 8px; font-size: 11.5px;
    font-family: ui-monospace, monospace; min-width: 48px; text-align: center;
  }

  .legend {
    position: absolute; left: 14px; bottom: 14px;
    background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px;
    font-size: 11px; line-height: 1.7; z-index: 10;
    color: var(--fg-muted);
  }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .legend .sw {
    width: 12px; height: 12px; border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  #panel {
    border-left: 1px solid var(--line);
    background: var(--bg-2);
    overflow-y: auto;
    padding: 20px 22px;
  }
  #panel h2 {
    margin: 0 0 4px 0; font-size: 15px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  #panel h2 .badge {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  }
  #panel .kind {
    color: var(--fg-faint); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.6px; margin: 0 0 14px 0;
  }
  #panel .label {
    color: var(--fg-faint); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.5px; margin: 12px 0 4px 0;
  }
  #panel .formula {
    background: var(--bg-3); border: 1px solid var(--line);
    border-radius: 6px; padding: 9px 11px; margin: 6px 0;
    color: var(--c-tensor); white-space: pre-wrap; line-height: 1.55;
  }
  #panel .shape {
    color: var(--c-norm); font-family: ui-monospace, monospace; font-size: 12px;
  }
  #panel .params {
    color: var(--c-attn); font-family: ui-monospace, monospace; font-size: 12px;
  }
  #panel .desc { color: var(--fg); font-size: 13px; line-height: 1.6; }
  #panel .desc p { margin: 6px 0; }
  #panel .pill {
    display: inline-block; padding: 2px 8px;
    background: var(--bg-3); border: 1px solid var(--line);
    border-radius: 999px; font-size: 11px; margin-right: 4px;
    color: var(--fg-muted);
  }
  #panel .empty {
    color: var(--fg-muted); font-size: 13px; padding: 32px 0; text-align: center;
  }
  #panel .empty .hint {
    font-size: 11.5px; color: var(--fg-faint); margin-top: 8px;
  }

  /* SVG block styles */
  .block { cursor: pointer; }
  .block:hover .face { filter: brightness(1.15); }
  .block.selected .face { filter: brightness(1.3); }
  .block.selected .outline {
    stroke: #ffffff; stroke-width: 2; stroke-dasharray: 4 3;
  }
  .face { stroke: rgba(0,0,0,0.35); stroke-width: 0.5; }
  .face.top { filter: brightness(0.78); }
  .face.right { filter: brightness(0.6); }
  .outline { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 1; }
  .label {
    fill: #0d0f14; font-size: 12px; font-weight: 600;
    font-family: ui-sans-serif, system-ui, sans-serif;
    pointer-events: none;
  }
  .label.light { fill: #ffffff; }
  .sublabel {
    fill: rgba(0,0,0,0.55); font-size: 10.5px;
    font-family: ui-monospace, monospace; pointer-events: none;
  }
  .sublabel.light { fill: rgba(255,255,255,0.75); }

  /* Layer card */
  .layer-card .outline-rect {
    stroke: var(--line-2); stroke-width: 1.5;
    fill: rgba(255,255,255,0.012);
  }
  .layer-card.expanded .outline-rect { stroke: rgba(94, 177, 255, 0.4); }
  .layer-card .header-bg { fill: var(--bg-3); stroke: var(--line); stroke-width: 1; }
  .layer-card .header-label {
    fill: var(--fg); font-size: 13px; font-weight: 600; pointer-events: none;
  }
  .layer-card .header-sub {
    fill: var(--fg-muted); font-size: 11px;
    font-family: ui-monospace, monospace; pointer-events: none;
  }
  .layer-card .toggle {
    fill: var(--fg-muted); font-size: 12px; pointer-events: none;
  }
  .layer-card .header { cursor: pointer; }
  .layer-card .header:hover .header-bg { fill: var(--line); }

  /* Sub-region inside layer (MLA, MoE) */
  .region .outline-rect {
    stroke: rgba(255,255,255,0.08); stroke-width: 1;
    stroke-dasharray: 3 3; fill: rgba(255,255,255,0.015);
  }
  .region-label {
    fill: var(--fg-muted); font-size: 11px;
    font-family: ui-monospace, monospace;
    letter-spacing: 0.5px; pointer-events: none;
  }

  /* Arrows */
  .arrow { stroke: var(--line-2); stroke-width: 1.2; fill: none; }
  .arrow-head { fill: var(--line-2); }

  /* Shape annotations */
  .shape-tag {
    fill: var(--c-norm); font-size: 10.5px;
    font-family: ui-monospace, monospace; pointer-events: none;
  }
  .params-tag {
    fill: var(--c-attn); font-size: 10.5px;
    font-family: ui-monospace, monospace; pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="title"><span class="whale">🐳</span> nanowhale <span class="sub">— DeepSeek-V4 ~110M, hand-drawn architecture</span></div>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div id="canvas-wrap">
    <div class="controls">
      <button id="zoom-out">−</button>
      <span class="scale-label" id="scale-label">100%</span>
      <button id="zoom-in">+</button>
      <span class="sep"></span>
      <button id="fit">Fit</button>
      <button id="expand-all">Expand all layers</button>
    </div>
    <div class="legend">
      <div class="row"><span class="sw" style="background:var(--c-token)"></span>tokens / logits</div>
      <div class="row"><span class="sw" style="background:var(--c-embed)"></span>embedding / lm_head</div>
      <div class="row"><span class="sw" style="background:var(--c-tensor)"></span>activation tensor</div>
      <div class="row"><span class="sw" style="background:var(--c-hc)"></span>Hyper-Connections (HC)</div>
      <div class="row"><span class="sw" style="background:var(--c-norm)"></span>RMSNorm</div>
      <div class="row"><span class="sw" style="background:var(--c-attn)"></span>MLA attention</div>
      <div class="row"><span class="sw" style="background:var(--c-moe)"></span>MoE / experts</div>
      <div class="row"><span class="sw" style="background:var(--c-rope)"></span>RoPE</div>
    </div>
    <svg id="scene"></svg>
  </div>

  <aside id="panel">
    <div id="panel-body">
      <div class="empty">
        <div>Click any block in the pipeline.</div>
        <div class="hint">Drag to pan · scroll to zoom · click layer headers to expand</div>
      </div>
    </div>
  </aside>
</main>

<script>
// ============================================================================
//  nanowhale architecture — hand-curated visualization
//
//  Everything is rendered procedurally from the PIPE descriptor below. Each
//  step in the forward pass becomes one block. Layer 0 is expanded by default
//  to expose the MLA / MoE / HC substructure, layers 1–7 stay collapsed unless
//  clicked. Coordinates are computed in a single layout pass so the diagram
//  re-flows whenever a layer toggles.
// ============================================================================

const CFG = {
  hidden: 320,
  num_layers: 8,
  vocab: 129280,
  num_heads: 8,
  num_kv_heads: 1,
  head_dim: 96,
  rope_dim: 32,
  nope_dim: 64,
  q_lora: 160,
  o_groups: 2,
  o_lora: 80,
  hc_mult: 4,
  hc_sinkhorn_iters: 2,
  n_routed: 4,
  n_shared: 1,
  top_k: 2,
  moe_ffn: 640,
  ctx: 2048,
  routed_scaling_factor: 1.5,
};

const PARAMS = {
  embed:     CFG.vocab * CFG.hidden,                          // 41,369,600
  wq_a:      CFG.hidden * CFG.q_lora,                         // 51,200
  q_norm:    CFG.q_lora,                                      // 160
  wq_b:      CFG.q_lora * (CFG.num_heads * CFG.head_dim),     // 122,880
  wkv:       CFG.hidden * CFG.head_dim,                       // 30,720
  kv_norm:   CFG.head_dim,                                    // 96
  wo_a:      CFG.num_heads * CFG.head_dim * CFG.o_lora,       // 61,440
  wo_b:      CFG.o_groups * CFG.o_lora * CFG.hidden,          // 51,200
  gate:      CFG.n_routed * CFG.hidden,                       // 1,280
  expert:    3 * CFG.hidden * CFG.moe_ffn,                    // 614,400
  hc_fn:     24 * (CFG.hc_mult * CFG.hidden),                 // 30,720
  attn_norm: CFG.hidden,                                      // 320
  lm_head:   CFG.hidden * CFG.vocab,                          // 41,369,600
};
PARAMS.attn_total =
  PARAMS.wq_a + PARAMS.q_norm + PARAMS.wq_b + PARAMS.wkv + PARAMS.kv_norm
  + PARAMS.wo_a + PARAMS.wo_b + CFG.num_heads;
PARAMS.moe_total = PARAMS.gate + (CFG.n_routed + CFG.n_shared) * PARAMS.expert;
PARAMS.hc_block  = 2 * PARAMS.hc_fn + 2 * 24 + 2 * 3;
PARAMS.layer_total = PARAMS.attn_total + PARAMS.moe_total + 2 * PARAMS.attn_norm + PARAMS.hc_block;
PARAMS.total =
  PARAMS.embed + CFG.num_layers * PARAMS.layer_total +
  (CFG.hc_mult * CFG.hidden + CFG.hc_mult + 1) +
  CFG.hidden + PARAMS.lm_head;

const fmt  = n => n.toLocaleString('en-US');
const fmtP = n => n >= 1e6 ? (n/1e6).toFixed(2) + 'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : ''+n;

function layerBlocks(idx) {
  const L = `L${idx}`;
  return [
    { id:`${L}.hc_pre_a`, kind:'op', color:'hc', label:'HC pre',
      sub:`Sinkhorn (${CFG.hc_sinkhorn_iters} iter)`, detail:'hcPre'},
    { id:`${L}.x_a`, kind:'tensor', color:'tensor', label:'x',
      shape:`[B, S, ${CFG.hidden}]`, detail:'tensorX'},
    { id:`${L}.attn_norm`, kind:'op', color:'norm', label:'attn_norm',
      sub:'RMSNorm', detail:'rmsnorm'},

    { id:`${L}.mla.region`, kind:'region', label:'Multi-head Latent Attention (MLA)',
      children:[
        { id:`${L}.wq_a`, kind:'op', color:'attn', label:'wq_a',
          sub:`[${CFG.hidden} → ${CFG.q_lora}]`, paramsKey:'wq_a', detail:'wq_a'},
        { id:`${L}.q_norm`, kind:'op', color:'norm', label:'q_norm', sub:'RMSNorm', detail:'rmsnorm'},
        { id:`${L}.wq_b`, kind:'op', color:'attn', label:'wq_b',
          sub:`[${CFG.q_lora} → ${CFG.num_heads}×${CFG.head_dim}]`,
          paramsKey:'wq_b', detail:'wq_b'},
        { id:`${L}.q_rope`, kind:'op', color:'rope', label:'RoPE(q)',
          sub:`last ${CFG.rope_dim} dims`, detail:'rope'},
        { id:`${L}.wkv`, kind:'op', color:'attn', label:'wkv',
          sub:`[${CFG.hidden} → ${CFG.head_dim}]   (1 KV head · MQA)`,
          paramsKey:'wkv', detail:'wkv'},
        { id:`${L}.kv_norm`, kind:'op', color:'norm', label:'kv_norm', sub:'RMSNorm', detail:'rmsnorm'},
        { id:`${L}.kv_rope`, kind:'op', color:'rope', label:'RoPE(kv)',
          sub:`last ${CFG.rope_dim} dims`, detail:'rope'},
        { id:`${L}.sdpa`, kind:'op', color:'sdpa', label:'SDPA',
          sub:`softmax(QKᵀ/√${CFG.head_dim}) · V   (causal, sink bias)`, detail:'sdpa'},
        { id:`${L}.de_rope`, kind:'op', color:'rope', label:'de-RoPE(out)',
          sub:'inverse rotation', detail:'derope'},
        { id:`${L}.wo_a`, kind:'op', color:'attn', label:'wo_a (grouped)',
          sub:`[${CFG.num_heads*CFG.head_dim/CFG.o_groups} → ${CFG.o_lora}] × ${CFG.o_groups} groups`,
          paramsKey:'wo_a', detail:'wo_a'},
        { id:`${L}.wo_b`, kind:'op', color:'attn', label:'wo_b',
          sub:`[${CFG.o_groups*CFG.o_lora} → ${CFG.hidden}]`,
          paramsKey:'wo_b', detail:'wo_b'},
      ]},

    { id:`${L}.hc_post_a`, kind:'op', color:'hc', label:'HC post',
      sub:'post · attn_out + comb · residual', detail:'hcPost'},

    { id:`${L}.hc_pre_f`, kind:'op', color:'hc', label:'HC pre',
      sub:`Sinkhorn (${CFG.hc_sinkhorn_iters} iter)`, detail:'hcPre'},
    { id:`${L}.x_f`, kind:'tensor', color:'tensor', label:'x',
      shape:`[B, S, ${CFG.hidden}]`, detail:'tensorX'},
    { id:`${L}.ffn_norm`, kind:'op', color:'norm', label:'ffn_norm', sub:'RMSNorm', detail:'rmsnorm'},

    { id:`${L}.moe.region`, kind:'region', label:'Mixture-of-Experts (MoE)',
      children:[
        { id:`${L}.gate`, kind:'op', color:'router', label:'gate',
          sub:`[${CFG.hidden} → ${CFG.n_routed}] · sqrtsoftplus · top-${CFG.top_k}`,
          paramsKey:'gate', detail:'gate'},
        { id:`${L}.experts`, kind:'experts',
          label:`${CFG.n_routed} routed experts + ${CFG.n_shared} shared`,
          detail:'experts'},
        { id:`${L}.combine`, kind:'op', color:'moe', label:'combine',
          sub:'Σᵢ wᵢ · expertᵢ(x) + shared(x)', detail:'combine'},
      ]},

    { id:`${L}.hc_post_f`, kind:'op', color:'hc', label:'HC post',
      sub:'post · moe_out + comb · residual', detail:'hcPost'},
  ];
}

const PIPE = [
  { id:'tokens', kind:'tensor', color:'token', label:'tokens',
    shape:`[B, S]    S ≤ ${CFG.ctx}`, detail:'tokens'},
  { id:'embed', kind:'op', color:'embed', label:'embed_tokens',
    sub:`nn.Embedding(${fmt(CFG.vocab)}, ${CFG.hidden})`,
    paramsKey:'embed', detail:'embed'},
  { id:'h0', kind:'tensor', color:'tensor', label:'h₀',
    shape:`[B, S, ${CFG.hidden}]`, detail:'tensorH0'},
  { id:'hc_expand', kind:'op', color:'hc', label:'HC expand',
    sub:`unsqueeze + expand → ${CFG.hc_mult} copies`, detail:'hcExpand'},
  { id:'h_hc', kind:'tensor', color:'tensor', label:'h_hc',
    shape:`[B, S, ${CFG.hc_mult}, ${CFG.hidden}]`,
    multiSheet: CFG.hc_mult, detail:'tensorHHC'},

  ...Array.from({length: CFG.num_layers}, (_, i) => ({
    id:`layer${i}`, kind:'layer', idx:i, expanded: i === 0,
    children: layerBlocks(i),
  })),

  { id:'hc_head', kind:'op', color:'hc', label:'hc_head',
    sub:`contract ${CFG.hc_mult} → 1`, detail:'hcHead'},
  { id:'h_out', kind:'tensor', color:'tensor', label:'h_out',
    shape:`[B, S, ${CFG.hidden}]`, detail:'tensorHOut'},
  { id:'final_norm', kind:'op', color:'norm', label:'norm',
    sub:'final RMSNorm', detail:'rmsnorm'},
  { id:'lm_head', kind:'op', color:'lmhead', label:'lm_head',
    sub:`Linear(${CFG.hidden}, ${fmt(CFG.vocab)})`,
    paramsKey:'lm_head', detail:'lmHead'},
  { id:'logits', kind:'tensor', color:'logits', label:'logits',
    shape:`[B, S, ${fmt(CFG.vocab)}]`, detail:'logits'},
];

// ----------------------------------------------------------------------------
// Layout
// ----------------------------------------------------------------------------

const L = {
  cx: 600,
  blockW: 360,
  narrowW: 280,
  blockH: 54,
  tensorH: 70,
  layerHeaderH: 44,
  innerPadTop: 18,
  innerPadBottom: 22,
  innerGap: 12,
  outerGap: 24,
  regionPad: 14,
  regionLabelH: 22,
  iso: 14,
};

function blockHeight(b) {
  if (b.kind === 'tensor') return L.tensorH;
  if (b.kind === 'experts') return 100;
  return L.blockH;
}
function regionHeight(children) {
  let h = L.regionLabelH;
  for (const c of children) h += blockHeight(c) + L.innerGap;
  return h + L.regionPad;
}
function layerHeight(b) {
  let total = L.layerHeaderH;
  if (b.expanded) {
    total += L.innerPadTop;
    for (const c of b.children) {
      if (c.kind === 'region') total += regionHeight(c.children) + L.innerGap;
      else total += blockHeight(c) + L.innerGap;
    }
    total += L.innerPadBottom;
  }
  return total;
}

function layout() {
  let y = 40;
  const pos = {};
  for (const b of PIPE) {
    if (b.kind === 'layer') {
      const h = layerHeight(b);
      pos[b.id] = { y, h };
      if (b.expanded) {
        let cy = y + L.layerHeaderH + L.innerPadTop;
        for (const c of b.children) {
          if (c.kind === 'region') {
            const rh = regionHeight(c.children);
            pos[c.id] = { y: cy, h: rh };
            let ry = cy + L.regionLabelH;
            for (const rc of c.children) {
              const ch = blockHeight(rc);
              pos[rc.id] = { y: ry, h: ch };
              ry += ch + L.innerGap;
            }
            cy += rh + L.innerGap;
          } else {
            const ch = blockHeight(c);
            pos[c.id] = { y: cy, h: ch };
            cy += ch + L.innerGap;
          }
        }
      }
      y += h + L.outerGap;
    } else {
      const h = blockHeight(b);
      pos[b.id] = { y, h };
      y += h + L.outerGap;
    }
  }
  return { pos, totalH: y + 40 };
}

// ----------------------------------------------------------------------------
// Rendering
// ----------------------------------------------------------------------------

const COLORS = {
  token: 'var(--c-token)', embed: 'var(--c-embed)', tensor: 'var(--c-tensor)',
  hc: 'var(--c-hc)', norm: 'var(--c-norm)', attn: 'var(--c-attn)',
  moe: 'var(--c-moe)', rope: 'var(--c-rope)', sdpa: 'var(--c-sdpa)',
  lmhead: 'var(--c-lmhead)', logits: 'var(--c-logits)',
  router: 'var(--c-router)', expert: 'var(--c-expert)',
};

const LIGHT_LABEL = new Set(['hc', 'attn', 'moe', 'sdpa', 'router', 'expert']);

function svg(tag, attrs = {}, ...kids) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const c of kids) {
    if (c == null) continue;
    if (typeof c === 'string') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

function isoBlock(x, y, w, h, color) {
  const d = L.iso;
  const g = svg('g', {class: 'block'});
  g.appendChild(svg('polygon', {
    class: 'face top',
    points: `${x},${y} ${x+w},${y} ${x+w+d},${y-d} ${x+d},${y-d}`,
    fill: color,
  }));
  g.appendChild(svg('polygon', {
    class: 'face right',
    points: `${x+w},${y} ${x+w},${y+h} ${x+w+d},${y+h-d} ${x+w+d},${y-d}`,
    fill: color,
  }));
  g.appendChild(svg('rect', {
    class: 'face front', x, y, width: w, height: h, fill: color, rx: 3, ry: 3,
  }));
  g.appendChild(svg('rect', {
    class: 'outline', x: x-2, y: y-2, width: w+4, height: h+4, rx: 5, ry: 5,
  }));
  return g;
}

function stackedBlock(x, y, w, h, color, n) {
  const g = svg('g', {class: 'block'});
  const off = 6;
  for (let i = n - 1; i >= 0; i--) {
    const op = 0.55 + i * (0.45 / Math.max(n - 1, 1));
    g.appendChild(svg('rect', {
      x: x + i * off, y: y - i * off, width: w, height: h, rx: 3, ry: 3,
      fill: color, opacity: op,
      stroke: 'rgba(0,0,0,0.35)', 'stroke-width': 0.5,
    }));
  }
  g.appendChild(svg('rect', {
    class: 'outline',
    x: x - 2, y: y - (n-1) * off - 2,
    width: w + (n-1) * off + 4, height: h + (n-1) * off + 4,
    rx: 5, ry: 5,
  }));
  return g;
}

function expertsRow(x, y, w, h) {
  const g = svg('g', {class: 'experts-row'});
  const n = CFG.n_routed;
  const gap = 10, sharedGap = 24, sharedW = 86;
  const expW = (w - sharedGap - sharedW - (n - 1) * gap) / n;
  for (let i = 0; i < n; i++) {
    const ex = x + i * (expW + gap);
    const inner = isoBlock(ex, y, expW, h, 'var(--c-expert)');
    inner.setAttribute('data-sub', `expert-${i}`);
    g.appendChild(inner);
    g.appendChild(svg('text', {
      x: ex + expW / 2, y: y + h / 2 - 2,
      class: 'label light', 'text-anchor': 'middle',
    }, `E${i}`));
    g.appendChild(svg('text', {
      x: ex + expW / 2, y: y + h / 2 + 14,
      class: 'sublabel light', 'text-anchor': 'middle',
    }, 'SwiGLU'));
  }
  const sx = x + w - sharedW;
  const shared = isoBlock(sx, y, sharedW, h, 'var(--c-moe)');
  shared.setAttribute('data-sub', 'shared');
  g.appendChild(shared);
  g.appendChild(svg('text', {
    x: sx + sharedW / 2, y: y + h / 2 - 2,
    class: 'label light', 'text-anchor': 'middle',
  }, 'shared'));
  g.appendChild(svg('text', {
    x: sx + sharedW / 2, y: y + h / 2 + 14,
    class: 'sublabel light', 'text-anchor': 'middle',
  }, 'always on'));
  return g;
}

function arrow(x, y1, y2) {
  const g = svg('g', {class: 'edge'});
  g.appendChild(svg('line', {x1: x, y1, x2: x, y2: y2 - 6, class: 'arrow'}));
  g.appendChild(svg('polygon', {
    points: `${x-4},${y2-6} ${x+4},${y2-6} ${x},${y2}`,
    class: 'arrow-head',
  }));
  return g;
}

function renderBlock(scene, b, p, inLayer) {
  const w = (inLayer || b.kind === 'experts' || (b.kind === 'op' && inLayer)) ? L.narrowW : L.blockW;
  const x = L.cx - w / 2;
  const y = p.y, h = p.h;
  const color = COLORS[b.color] || COLORS.tensor;

  const wrap = svg('g', {class: `block-wrap kind-${b.kind}`, 'data-id': b.id});

  if (b.kind === 'experts') {
    wrap.appendChild(expertsRow(x, y, w, h));
  } else if (b.multiSheet) {
    wrap.appendChild(stackedBlock(x, y, w, h, color, b.multiSheet));
  } else {
    wrap.appendChild(isoBlock(x, y, w, h, color));
  }

  if (b.kind !== 'experts' && b.label) {
    const light = LIGHT_LABEL.has(b.color);
    const labelCls = light ? 'label light' : 'label';
    const subCls = light ? 'sublabel light' : 'sublabel';
    const titleY = b.sub ? y + h / 2 - 3 : y + h / 2 + 5;
    wrap.appendChild(svg('text', {
      x: L.cx, y: titleY, class: labelCls, 'text-anchor': 'middle',
    }, b.label));
    if (b.sub) {
      wrap.appendChild(svg('text', {
        x: L.cx, y: y + h / 2 + 13, class: subCls, 'text-anchor': 'middle',
      }, b.sub));
    }
  }

  // Shape annotation on the right
  if (b.kind === 'tensor' && b.shape) {
    wrap.appendChild(svg('text', {
      x: x + w + L.iso + 14, y: y + h / 2 + 4,
      class: 'shape-tag',
    }, b.shape));
  }
  if (b.paramsKey && PARAMS[b.paramsKey]) {
    wrap.appendChild(svg('text', {
      x: x + w + L.iso + 14, y: y + h / 2 + 4,
      class: 'params-tag',
    }, fmtP(PARAMS[b.paramsKey]) + ' p'));
  }

  wrap.addEventListener('click', (e) => {
    e.stopPropagation();
    selectBlock(b);
  });
  scene.appendChild(wrap);
}

function renderRegion(scene, r, p) {
  const w = L.narrowW + 60;
  const x = L.cx - w / 2;
  const wrap = svg('g', {class: 'region', 'data-id': r.id});
  wrap.appendChild(svg('rect', {
    class: 'outline-rect', x, y: p.y, width: w, height: p.h, rx: 8, ry: 8,
  }));
  wrap.appendChild(svg('text', {
    x: x + 10, y: p.y + 15, class: 'region-label',
  }, r.label.toUpperCase()));
  scene.appendChild(wrap);
}

function renderLayer(scene, b, p) {
  const w = L.blockW + 90;
  const x = L.cx - w / 2;
  const wrap = svg('g', {class: `layer-card ${b.expanded ? 'expanded' : ''}`, 'data-id': b.id});

  wrap.appendChild(svg('rect', {
    class: 'outline-rect', x, y: p.y, width: w, height: p.h, rx: 10, ry: 10,
  }));

  const header = svg('g', {class: 'header'});
  header.appendChild(svg('rect', {
    class: 'header-bg', x, y: p.y, width: w, height: L.layerHeaderH, rx: 10, ry: 10,
  }));
  header.appendChild(svg('text', {
    x: x + 18, y: p.y + 27, class: 'header-label',
  }, `Layer ${b.idx}`));
  header.appendChild(svg('text', {
    x: x + 110, y: p.y + 27, class: 'header-sub',
  }, `${fmtP(PARAMS.layer_total)} params · attn ${fmtP(PARAMS.attn_total)} · MoE ${fmtP(PARAMS.moe_total)} · HC ${fmtP(PARAMS.hc_block)}`));
  header.appendChild(svg('text', {
    x: x + w - 18, y: p.y + 27, class: 'toggle', 'text-anchor': 'end',
  }, b.expanded ? '▾  collapse' : '▸  expand'));
  header.addEventListener('click', (e) => {
    e.stopPropagation();
    b.expanded = !b.expanded;
    render();
  });
  wrap.appendChild(header);
  scene.appendChild(wrap);
}

let SELECTED = null;
let TOTAL_H = 0;
const SCENE_W = 1200;

function render() {
  const { pos, totalH } = layout();
  TOTAL_H = totalH;
  const scene = document.getElementById('scene');
  scene.innerHTML = '';
  scene.setAttribute('width', SCENE_W);
  scene.setAttribute('height', totalH);

  // First pass: arrows
  let lastBottom = null;
  for (const b of PIPE) {
    const p = pos[b.id];
    if (lastBottom != null) scene.appendChild(arrow(L.cx, lastBottom, p.y));
    if (b.kind === 'layer') {
      lastBottom = p.y + p.h;
      if (b.expanded) {
        let prevBot = null;
        for (const c of b.children) {
          if (c.kind === 'region') {
            const rp = pos[c.id];
            if (prevBot != null) scene.appendChild(arrow(L.cx, prevBot, rp.y));
            // inner arrows handled per region children below
            let pb = rp.y + L.regionLabelH;
            let first = true;
            for (const rc of c.children) {
              const rcp = pos[rc.id];
              if (!first) scene.appendChild(arrow(L.cx, pb, rcp.y));
              pb = rcp.y + rcp.h;
              first = false;
            }
            prevBot = rp.y + rp.h;
          } else {
            const cp = pos[c.id];
            if (prevBot != null) scene.appendChild(arrow(L.cx, prevBot, cp.y));
            prevBot = cp.y + cp.h;
          }
        }
      }
    } else {
      lastBottom = p.y + p.h;
    }
  }

  // Second pass: blocks
  for (const b of PIPE) {
    const p = pos[b.id];
    if (b.kind === 'layer') {
      renderLayer(scene, b, p);
      if (b.expanded) {
        for (const c of b.children) {
          if (c.kind === 'region') {
            renderRegion(scene, c, pos[c.id]);
            for (const rc of c.children) renderBlock(scene, rc, pos[rc.id], true);
          } else {
            renderBlock(scene, c, pos[c.id], true);
          }
        }
      }
    } else {
      renderBlock(scene, b, p, false);
    }
  }

  // Reapply selection
  if (SELECTED) {
    const el = scene.querySelector(`.block-wrap[data-id="${SELECTED.id}"] .block`);
    if (el) el.classList.add('selected');
  }
  updateViewBox();
}

// ----------------------------------------------------------------------------
// Pan / zoom
// ----------------------------------------------------------------------------

const view = { x: 0, y: 0, w: 1200, h: 0, scale: 1 };
let dragging = null;

function fitToView() {
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  view.w = rect.width;
  view.h = rect.height;
  // Fit whole diagram (width = SCENE_W ~ 720 effective, height = TOTAL_H)
  const sx = rect.width / 720;
  const sy = rect.height / TOTAL_H;
  view.scale = Math.min(sx, sy) * 0.95;
  view.x = L.cx - (rect.width / view.scale) / 2;
  view.y = -20;
}

function updateViewBox() {
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  if (view.h === 0) {
    fitToView();
  }
  const scene = document.getElementById('scene');
  scene.setAttribute('viewBox', `${view.x} ${view.y} ${view.w / view.scale} ${view.h / view.scale}`);
  scene.setAttribute('width', rect.width);
  scene.setAttribute('height', rect.height);
  document.getElementById('scale-label').textContent = Math.round(view.scale * 100) + '%';
}

function zoomAt(factor, clientX, clientY) {
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const px = (clientX - rect.left) / rect.width;
  const py = (clientY - rect.top) / rect.height;
  const wx = view.x + (view.w / view.scale) * px;
  const wy = view.y + (view.h / view.scale) * py;
  const newScale = Math.max(0.15, Math.min(4, view.scale * factor));
  view.scale = newScale;
  view.x = wx - (view.w / view.scale) * px;
  view.y = wy - (view.h / view.scale) * py;
  updateViewBox();
}

function initPanZoom() {
  const wrap = document.getElementById('canvas-wrap');
  wrap.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    dragging = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y };
    wrap.classList.add('grabbing');
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    view.x = dragging.vx - (e.clientX - dragging.sx) / view.scale;
    view.y = dragging.vy - (e.clientY - dragging.sy) / view.scale;
    updateViewBox();
  });
  window.addEventListener('mouseup', () => {
    dragging = null;
    wrap.classList.remove('grabbing');
  });
  wrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    zoomAt(e.deltaY > 0 ? 1 / 1.12 : 1.12, e.clientX, e.clientY);
  }, { passive: false });

  document.getElementById('zoom-in').onclick = () => {
    const r = wrap.getBoundingClientRect();
    zoomAt(1.2, r.left + r.width / 2, r.top + r.height / 2);
  };
  document.getElementById('zoom-out').onclick = () => {
    const r = wrap.getBoundingClientRect();
    zoomAt(1 / 1.2, r.left + r.width / 2, r.top + r.height / 2);
  };
  document.getElementById('fit').onclick = () => {
    fitToView();
    updateViewBox();
  };
  const expandBtn = document.getElementById('expand-all');
  expandBtn.onclick = () => {
    const layers = PIPE.filter(b => b.kind === 'layer');
    const allExpanded = layers.every(b => b.expanded);
    for (const b of layers) b.expanded = !allExpanded;
    expandBtn.textContent = allExpanded ? 'Expand all layers' : 'Collapse all layers';
    render();
  };
  window.addEventListener('resize', () => {
    const r = wrap.getBoundingClientRect();
    view.w = r.width; view.h = r.height;
    updateViewBox();
  });
}

    title: 'Per-sub-layer input', color: 'tensor',

           <p class="label">Shape</p><div class="shape">[B, S, ${CFG.hidden}]</div>`,
  },
  tensorHOut: {
    title: 'Hidden state after the last block', color: 'tensor',
    body: `<p>Output of <code>hc_head</code>: the 4 HC copies have been contracted back to a single vector per token.</p>
           <p class="label">Shape</p><div class="shape">[B, S, ${CFG.hidden}]</div>`,
  },
  lmHead: {
    title: 'lm_head — token-vocabulary projection', color: 'lmhead',
    body: `<p>Project the final hidden vector back into vocab space. <strong>Not</strong> tied to <code>embed_tokens</code> in this checkpoint.</p>
           <div class="formula">logits = h_out @ W_lm_headᵀ   # [B, S, ${fmt(CFG.vocab)}]</div>
           <p class="label">Shape · Params</p>
           <div class="shape">[${CFG.hidden}, ${fmt(CFG.vocab)}]</div>
           <div class="params">${fmt(PARAMS.lm_head)} parameters</div>
           <p>Together with the embedding table, these two matrices account for <strong>${(2*PARAMS.embed/PARAMS.total*100).toFixed(0)}%</strong> of the parameter budget.</p>`,
  },
  logits: {
    title: 'Output logits', color: 'logits',
    body: `<p>Unnormalised log-probabilities over the vocabulary, per token position.</p>
           <p class="label">Shape</p><div class="shape">[B, S, ${fmt(CFG.vocab)}]</div>
           <p>Apply <code>softmax</code> to sample / score; cross-entropy against next-token labels is the pretraining loss.</p>`,
  },
};

function selectBlock(b) {
  SELECTED = b;
  document.querySelectorAll('.block-wrap .block').forEach(el => el.classList.remove('selected'));
  const el = document.querySelector(`.block-wrap[data-id="${b.id}"] .block`);
  if (el) el.classList.add('selected');

  const key = b.detail;
  const d = DETAILS[key] || {
    title: b.label || b.id, color: b.color || 'tensor',
    body: `<p>${b.sub || ''}</p>`,
  };
  const colorVar = COLORS[d.color] || COLORS.tensor;
  document.getElementById('panel-body').innerHTML = `
    <h2><span class="badge" style="background:${colorVar}"></span>${d.title}</h2>
    <p class="kind">${b.kind}${b.id.includes('.') ? '  ·  ' + b.id : ''}</p>
    <div class="desc">${d.body}</div>
  `;
}

// ----------------------------------------------------------------------------
// Header chips
// ----------------------------------------------------------------------------

function renderChips() {
  const chips = [
    ['Params', fmtP(PARAMS.total)],
    ['Layers', CFG.num_layers],
    ['Hidden', CFG.hidden],
    ['HC', CFG.hc_mult],
    ['Heads', `${CFG.num_heads}/${CFG.num_kv_heads}KV`],
    ['head_dim', `${CFG.head_dim}=${CFG.rope_dim}+${CFG.nope_dim}`],
    ['MoE', `${CFG.n_routed}r+${CFG.n_shared}s top-${CFG.top_k}`],
    ['FFN', CFG.moe_ffn],
    ['Ctx', fmt(CFG.ctx)],
    ['Vocab', fmt(CFG.vocab)],
  ];
  document.getElementById('chips').innerHTML =
    chips.map(([k,v]) => `<span class="chip">${k}<b>${v}</b></span>`).join('');
}

// ----------------------------------------------------------------------------
// Boot
// ----------------------------------------------------------------------------

renderChips();
render();
initPanZoom();

// Auto-select the embedding block to seed the panel.
setTimeout(() => {
  const embed = PIPE.find(b => b.id === 'embed');
  if (embed) selectBlock(embed);
}, 50);
</script>
</body>
</html>
